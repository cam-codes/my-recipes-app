services:
  backend:
    image: ghcr.io/cam-codes/my-recipes-backend:${RELEASE_TAG}
    container_name: my-recipes-backend-staging
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      RECIPES_DIRECTORY: /recipes
      BACKEND_PORT: 3000
    volumes:
      - /data/recipes/staging:/recipes:rw
    healthcheck:
      test: [
        "CMD",
        "deno",
        "eval",
        "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)Deno.exit(1)})"
      ]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    image: ghcr.io/cam-codes/my-recipes-frontend:${RELEASE_TAG}
    container_name: my-recipes-frontend-staging
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [
        "CMD",
        "curl",
        "-f",
        "http://localhost"
      ]
      interval: 10s
      timeout: 3s
      retries: 5
