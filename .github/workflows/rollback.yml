name: Rollback Deployment

on:
  workflow_dispatch:
    inputs:
      env:
        description: 'Target environment (staging or prod)'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - prod
      release_tag:
        description: 'Release tag to rollback to'
        required: true

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      # ---------------------------
      #  Checkout code
      # ---------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------------------------
      #  Rollback
      # ---------------------------
      - name: Rollback Docker containers
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ github.event.inputs.env == 'staging' && secrets.STAGING_USER || secrets.PROD_USER }}
          key: ${{ github.event.inputs.env == 'staging' && secrets.STAGING_SSH_KEY || secrets.PROD_SSH_KEY }}
          script: |
            set -euxo pipefail

            ENV=${{ github.event.inputs.env }}
            RELEASE_TAG=${{ github.event.inputs.release_tag }}

            VM_DIR=/opt/my-recipes/$ENV
            COMPOSE_FILE=docker-compose.$ENV.yml

            cd $VM_DIR

            echo "Rolling back $ENV to release $RELEASE_TAG"

            # Rewrite env file to point to target release
            cat <<EOF > "$VM_DIR/.env"
            RELEASE_TAG=$RELEASE_TAG
            EOF
            chmod 600 .env

            # Pull backend + frontend images for this release
            docker compose -f "$COMPOSE_FILE" pull

            # Start containers
            docker compose -f "$COMPOSE_FILE" up -d --remove-orphans

            # Reload Caddy
            sudo systemctl reload caddy

            echo "Rollback complete for $ENV"
