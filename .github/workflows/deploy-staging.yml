name: Deploy to Staging

on:
  workflow_run:
    workflows: ["Build, Test, & Push"]
    types:
      - completed

jobs:
  deploy-staging:
    # Only deploy staging for main branch commits, skip if this is a release tag
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      !startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    steps:
      # ---------------------------
      #  Checkout code
      # ---------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------------------------
      #  Copy docker-compose
      # ---------------------------
      - name: Copy docker-compose
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          source: docker-compose.staging.yml
          target: /opt/my-recipes/staging/

      # ---------------------------
      #  Deploy Docker containers
      # ---------------------------
      - name: Deploy Docker containers
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -euxo pipefail
            VM_DIR=/opt/my-recipes/staging
            cd $VM_DIR

            # Write env vars to .env
            cat <<EOF > $VM_DIR/.env
            ${{ secrets.ENV_STAGING }}
            RELEASE_TAG=${{ github.event.workflow_run.head_sha }}
            EOF
            chmod 600 .env

            # Pull backend + frontend images for this release
            docker compose -f docker-compose.staging.yml pull

            # Start containers
            docker compose -f docker-compose.staging.yml up -d --remove-orphans

            # Reload Caddy
            sudo systemctl reload caddy

            echo "Staging deploy complete"
