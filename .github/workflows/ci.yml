name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recipes:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repo
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.GH_PAT_FOR_RUNNERS || github.token }}

      - name: Setup Node
        if: github.event_name == 'pull_request'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify recipes are ASCII-only (autofix)
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if node scripts/check-recipes-ascii.mjs; then
            echo "All recipe files are ASCII-only."
            exit 0
          fi
          node scripts/fix-recipes-ascii.mjs
          if git diff --quiet -- recipes; then
            echo "No recipe changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add recipes
          git commit -m "chore: normalize recipes to ASCII"
          git push origin HEAD:${{ github.head_ref }}

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Backend
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: 2.6.6

      - name: Format and Lint
        run: |
          deno task fmt:check
          deno task lint:check

      # ---------------------------
      # Unit test backend
      # ---------------------------
      - name: Test Coverage
        run: deno task test:coverage

      # ---------------------------
      # Upload coverage artifact
      # ---------------------------
      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.lcov

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Frontend
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: |
          corepack enable
          yarn install --immutable

      - name: Lint and Format
        run: |
          yarn lint:check
          yarn format:check

      - name: Build
        run: yarn build

      # ---------------------------
      # Unit test frontend
      # ---------------------------
      - name: Test Coverage
        run: yarn test:coverage

      # ---------------------------
      # Upload coverage artifact
      # ---------------------------
      - name: Upload Frontend Coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
