name: Deploy to Staging

on:
  push:
    branches: [main]

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    steps:
      # ---------------------------
      #  Checkout code
      # ---------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------------------------
      #  Ensure VM directory exists
      # ---------------------------
      - name: Prepare VM directory
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            sudo mkdir -p /opt/my-recipes/staging
            sudo chown staging:staging /opt/my-recipes/staging

      # ---------------------------
      #  Copy docker-compose
      # ---------------------------
      - name: Copy docker-compose
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          source: docker-compose.staging.yml
          target: /opt/my-recipes/staging/

      # ---------------------------
      #  Deploy Docker containers
      # ---------------------------
      - name: Deploy Docker containers
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -euxo pipefail
            VM_DIR=/opt/my-recipes/staging
            cd $VM_DIR

            # Write env vars
            cat <<EOF > $VM_DIR/staging.env
            ${{ secrets.ENV_STAGING }}
            RELEASE_TAG=${{ github.sha }}
            EOF

            # Pull backend + frontend images for this release
            docker compose \
              -f docker-compose.staging.yml \
              --env-file $VM_DIR/staging.env \
              pull

            # Start containers
            docker compose \
              -f docker-compose.staging.yml \
              --env-file $VM_DIR/staging.env \
              up -d --remove-orphans

            # Reload Caddy
            sudo systemctl reload caddy
