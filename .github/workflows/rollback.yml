name: Rollback Deployment

on:
  workflow_dispatch:
    inputs:
      env:
        description: 'Environment to rollback (staging|prod)'
        required: true
        default: 'staging'
      release_tag:
        description: 'Release tag to rollback to'
        required: true

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      # ---------------------------
      #  Checkout code
      # ---------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------------------------
      #  Rollback
      # ---------------------------
      - name: Rollback Docker containers
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ github.event.inputs.env == 'staging' && secrets.STAGING_HOST || secrets.PROD_HOST }}
          username: ${{ github.event.inputs.env == 'staging' && secrets.STAGING_USER || secrets.PROD_USER }}
          key: ${{ github.event.inputs.env == 'staging' && secrets.STAGING_SSH_KEY || secrets.PROD_SSH_KEY }}
          script: |
            set -euxo pipefail

            ENV=${{ github.event.inputs.env }}
            RELEASE_TAG=${{ github.event.inputs.release_tag }}

            VM_DIR=/opt/my-recipes/$ENV
            DOCKER_COMPOSE_FILE=docker-compose.$ENV.yml

            cd $VM_DIR

            echo "Rolling back $ENV to release $RELEASE_TAG"

            docker compose -f $DOCKER_COMPOSE_FILE pull \
              ghcr.io/${{ github.repository_owner }}/my-recipes-backend:$RELEASE_TAG \
              ghcr.io/${{ github.repository_owner }}/my-recipes-frontend:$RELEASE_TAG

            docker compose -f $DOCKER_COMPOSE_FILE up -d --remove-orphans

            echo "Rollback complete for $ENV"
