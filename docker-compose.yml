services:
  backend:
    image: my-recipes-backend
    build: ./backend
    container_name: my-recipes-backend
    ports:
      - "3000:3000"           # expose backend to host for browser and frontend testing
    environment:
      RECIPES_DIRECTORY: /recipes
      BACKEND_PORT: 3000
    volumes:
      - ./recipes:/recipes    # live recipes for testing
    healthcheck:
      test: [
        "CMD",
        "deno",
        "eval",
        "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)Deno.exit(1)})"
      ]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    image: my-recipes-frontend
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: my-recipes-frontend
    ports:
      - "5173:80"           # expose frontend to host
    environment:
      # API_BASE for the frontend, container can reach backend via service name
      VITE_API_BASE: http://backend:3000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost" ]
      interval: 10s
      timeout: 3s
      retries: 5
