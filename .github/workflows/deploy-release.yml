name: Release Promotion (Staging → E2E → Prod)

on:
  workflow_run:
    workflows: ["Build, Test, & Push"]
    types:
      - completed


jobs:
  deploy-staging-release:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy docker-compose
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          source: docker-compose.staging.yml
          target: /opt/my-recipes/staging/

      - name: Deploy to Staging by Release Tag
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -euxo pipefail
            VM_DIR=/opt/my-recipes/staging
            cd $VM_DIR

            cat <<EOF > .env
            ${{ secrets.ENV_STAGING }}
            RELEASE_TAG=${{ github.event.workflow_run.head_branch }}
            EOF
            chmod 600 .env

            docker compose -f docker-compose.staging.yml pull
            docker compose -f docker-compose.staging.yml up -d --remove-orphans
            sudo systemctl reload caddy

            echo "Staging release deploy complete"

  e2e-staging:
    needs: deploy-staging-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'yarn'
          cache-dependency-path: yarn.lock

      - name: Install deps
        working-directory: frontend
        run: yarn install --immutable

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('yarn.lock') }}

      - name: Install Playwright
        working-directory: frontend
        run: npx playwright install

      - name: Run E2E Tests
        working-directory: frontend
        env:
          E2E_ENV: staging
          PLAYWRIGHT_BASE_URL: https://${{ secrets.STAGING_DOMAIN }}
        run: npx playwright test

  # Manual approval before prod
  approval:
   needs: e2e-staging
   runs-on: ubuntu-latest
   environment: production
   steps:
     - run: echo "Waiting for approval..."

  deploy-prod:
    needs: approval
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy docker-compose
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          source: docker-compose.prod.yml
          target: /opt/my-recipes/prod/

      - name: Deploy to Prod
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -euxo pipefail
            VM_DIR=/opt/my-recipes/prod
            cd $VM_DIR

            cat <<EOF > .env
            ${{ secrets.ENV_PROD }}
            RELEASE_TAG=${{ github.event.workflow_run.head_branch }}
            VITE_GA_MEASUREMENT_ID=${{ secrets.GA_MEASUREMENT_ID }}
            EOF
            chmod 600 .env

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            sudo systemctl reload caddy

            echo "Prod deploy complete"
