server {
    listen       80;
    server_name  localhost;

    # Important: tell nginx NOT to add trailing slashes automatically
    # and to include the port in any Location headers it generates
    absolute_redirect off;
    port_in_redirect on;

    # Serve the SolidJS SPA
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;   # fallback to index.html for client-side routing
    }

    # Proxy ALL /recipes* requests
    # This prevents nginx from thinking it's a directory and auto-redirecting
    location /recipes {
        resolver 127.0.0.11 valid=30s;                      # Docker Compose internal DNS server

        proxy_pass http://backend:3000;             # ← backend = service name in docker-compose
        proxy_set_header Host $http_host;           # preserves localhost:5173
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Extra insurance against bad redirects
        proxy_redirect off;
    }

    # If trailing / is requested, internally rewrite to no-slash version
    # This avoids backend seeing /recipes/ as unknown
    location = /recipes/ {
        rewrite ^ /recipes permanent;  # internal redirect (no browser visible 301)
    }

    # uncomment to add logging if you want to debug
    error_log  /var/log/nginx/error.log warn;
    access_log /var/log/nginx/access.log;
}
