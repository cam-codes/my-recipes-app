name: Build & Push Images

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Backend
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: 2.6.6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend Image
        run: |
          cd ..
          docker build -f backend/Dockerfile \
            --build-arg GIT_COMMIT=${{ github.sha }} \
            --build-arg LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "") \
            --build-arg GIT_TAG=$(git describe --tags --exact-match) \
            -t ghcr.io/${{ github.repository_owner }}/my-recipes-backend:${{ github.sha }} \
            .
          docker push ghcr.io/${{ github.repository_owner }}/my-recipes-backend:${{ github.sha }}

          # If this is a tagged release, also push the tag (for prod)
          if git describe --tags --exact-match >/dev/null 2>&1; then
            TAG=$(git describe --tags --exact-match)
            docker tag $IMAGE:${{ github.sha }} $IMAGE:$TAG
            docker push $IMAGE:$TAG
            docker tag $IMAGE:${{ github.sha }} $IMAGE:latest
            docker push $IMAGE:latest
          fi

  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Frontend
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Frontend Image
        run: |
          cd ..
          docker build -f frontend/Dockerfile \
            -t ghcr.io/${{ github.repository_owner }}/my-recipes-frontend:${{ github.sha }} \
            .
          docker push ghcr.io/${{ github.repository_owner }}/my-recipes-frontend:${{ github.sha }}
