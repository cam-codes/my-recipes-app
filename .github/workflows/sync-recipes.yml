name: Sync Recipes

on:
  workflow_dispatch:
    inputs:
      env:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - prod

jobs:
  sync-recipes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set env vars on VM
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ github.event.inputs.env == 'staging' && secrets.STAGING_USER || secrets.PROD_USER }}
          key: ${{ github.event.inputs.env == 'staging' && secrets.STAGING_SSH_KEY || secrets.PROD_SSH_KEY }}
          script: |
            set -euxo pipefail

            ENV="${{ github.event.inputs.env }}"
            SRC_DIR="/opt/my-recipes/$ENV/recipes-sync"
            DEST_DIR="/data/recipes/$ENV"

            mkdir -p "$SRC_DIR"
            rm -rf "$SRC_DIR"/*

      - name: Copy recipes
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ github.event.inputs.env == 'staging' && secrets.STAGING_USER || secrets.PROD_USER }}
          key: ${{ github.event.inputs.env == 'staging' && secrets.STAGING_SSH_KEY || secrets.PROD_SSH_KEY }}
          source: "recipes/*"
          target: /opt/my-recipes/${{ github.event.inputs.env }}/recipes-sync/
          strip_components: 1

      - name: Activate recipes
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ github.event.inputs.env == 'staging' && secrets.STAGING_USER || secrets.PROD_USER }}
          key: ${{ github.event.inputs.env == 'staging' && secrets.STAGING_SSH_KEY || secrets.PROD_SSH_KEY }}
          script: |
            set -euxo pipefail

            ENV="${{ github.event.inputs.env }}"
            SRC_DIR="/opt/my-recipes/$ENV/recipes-sync"
            DEST_DIR="/data/recipes/$ENV"

            sudo rm -rf "$DEST_DIR"/*
            sudo mv "$SRC_DIR"/* "$DEST_DIR"

            echo "Recipes synced for $ENV"
