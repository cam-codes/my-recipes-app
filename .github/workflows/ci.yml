name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  recipes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Detect recipe changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            recipes:
              - 'recipes/**'

      - name: Setup Node
        if: steps.changes.outputs.recipes == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify recipe files are ASCII-only
        if: steps.changes.outputs.recipes == 'true'
        run: node scripts/check-recipes-ascii.mjs

      - name: Skip ASCII check (no recipe changes)
        if: steps.changes.outputs.recipes != 'true'
        run: echo "No recipe changes detected."

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Backend
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: 2.6.6

      - name: Format and Lint
        run: |
          deno task fmt:check
          deno task lint:check

      # ---------------------------
      # Unit test backend
      # ---------------------------
      - name: Test Coverage
        run: deno task test:coverage

      # ---------------------------
      # Upload coverage artifact
      # ---------------------------
      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.lcov

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Frontend
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: |
          corepack enable
          yarn install --immutable

      - name: Lint and Format
        run: |
          yarn lint:check
          yarn format:check

      - name: Build
        run: yarn build

      # ---------------------------
      # Unit test frontend
      # ---------------------------
      - name: Test Coverage
        run: yarn test:coverage

      # ---------------------------
      # Upload coverage artifact
      # ---------------------------
      - name: Upload Frontend Coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
